interface:
  display_name: "KR Apartment Market"
  short_description: "한국 부동산 최신 신고 실거래와 시장 지표 분석"
  brand_color: "#1F5EFF"
  default_prompt: >-
    대한민국 부동산의 최신 신고 실거래를 조회하고, 동일 전용면적 기준으로
    가격·거래량·회복률·전세가율·추정 갭을 원천과 데이터 신선도까지 포함해
    분석해 주세요. 사실, 계산 지표, 해석을 구분해 주세요.

policy:
  allow_implicit_invocation: true

dependencies:
  tools:
    - type: "mcp"
      value: "kr-apartment-market"
      description: >-
        국토교통부 공공 실거래 조회, 단지·지역 분석, 결정론적 금융 계산,
        개인용 관심 목록과 선택형 real-estate-mcp 호환 도구를 제공하는 통합 서버
      transport: "streamable_http"
      # 공개 배포 시 아래 URL을 실제 TLS MCP endpoint로 교체합니다.
      url: "https://REPLACE_WITH_DEPLOYED_HOST.example/mcp"
