interface:
  display_name: "KR Apartment Market · AI Home Finder"
  short_description: "주거 선호를 점수화해 단지를 추천하고 실거래·현재 매물 원문을 연결"
  brand_color: "#111111"
  default_prompt: >-
    나의 예산, 희망 지역, 전용면적, 통근, 가구 구성과 주거 선호를 구조화한 뒤
    국토교통부 최신 신고 실거래를 근거로 적합도가 높은 아파트 단지를 추천해 주세요.
    필수 조건과 선호 조건을 구분하고, 적합도와 데이터 신뢰도를 별도로 표시하며,
    네이버 부동산·당근 부동산·피터팬·아실·KB부동산의 원문 매물 확인 링크도 제공해 주세요.

policy:
  allow_implicit_invocation: true

dependencies:
  tools:
    - type: "mcp"
      value: "kr-apartment-market"
      description: >-
        국토교통부 실거래 분석, 설명 가능한 단지 추천, 원문 광고매물 링크 허브,
        관심 단지·저장 검색 및 선택형 real-estate-mcp 호환 도구를 제공하는 단일 서버
      transport: "streamable_http"
      # 공개 배포 시 실제 TLS MCP endpoint로 교체합니다.
      url: "https://REPLACE_WITH_DEPLOYED_HOST.example/mcp"
