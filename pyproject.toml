[project]
name = "kr-apartment-market-skill"
version = "2.0.0"
description = "Korean real-estate market AI Skill and integrated MCP server backed by public transaction data"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "JTech_CO" }]
keywords = ["mcp", "real-estate", "korea", "apartment", "open-data", "ai-skill"]
classifiers = [
  "Development Status :: 4 - Beta",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Office/Business :: Financial",
]
dependencies = [
  "defusedxml>=0.7.1",
  "httpx>=0.27.0",
  "mcp[cli]>=1.0.0",
  "python-dotenv>=1.0.0",
  "uvicorn>=0.30.0",
]

[project.optional-dependencies]
dev = [
  "build>=1.2.0",
  "pytest>=8.0.0",
  "pytest-asyncio>=0.24.0",
  "pytest-cov>=6.0.0",
  "respx>=0.22.0",
  "ruff>=0.8.0",
]

[project.scripts]
kr-apartment-market = "kr_apartment_market.server:main"
real-estate-mcp = "real_estate.mcp_server.server:main"

[project.urls]
Homepage = "https://jtech-co.github.io/kr-apartment-market-skill/"
Repository = "https://github.com/JTech-CO/kr-apartment-market-skill"
Issues = "https://github.com/JTech-CO/kr-apartment-market-skill/issues"

[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]
include = ["kr_apartment_market*", "real_estate*"]

[tool.setuptools.package-data]
kr_apartment_market = ["resources/*.tsv", "resources/*.json"]
real_estate = ["resources/*.txt", "LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests/runtime"]
asyncio_mode = "auto"
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "B", "UP"]
ignore = ["E501"]
